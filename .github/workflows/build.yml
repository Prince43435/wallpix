name: Build WallPix APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android tools
        run: |
          echo "ANDROID_JAR=$(ls $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -1)" >> "$GITHUB_ENV"
          BT="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
          aapt2 version
          d8 --version || true

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > signing/wallpix.jks
          else
            keytool -genkeypair -keystore signing/wallpix.jks -alias wallpix \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass wallpix123 -keypass wallpix123 \
              -dname "CN=WallPix, OU=AntiGem, O=WallPix, C=IN"
          fi

      - name: Build Admin + User APKs
        run: python3 build.sh both

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WallPix-APKs
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          overwrite_files: true
